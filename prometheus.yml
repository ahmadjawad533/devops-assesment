global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'apex-operations'
    environment: 'local'

scrape_configs:
  - job_name: 'apex-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['api:3000']
        labels:
          instance: 'apex-api-01'
          service: 'apex-operations-api'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
